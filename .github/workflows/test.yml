name: Host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Initialize SDK headers
        run: git submodule update --init vendor/elekloader
      - name: C mechanics and device isolation
        run: mise run test
      - name: Portable measurement and spectral checks
        run: mise run test:oscillators
      - name: Frozen slow-modulation cases
        run: mise run test:modulation
      - name: Device internal rate against targets and alias baseline
        run: mise run test:device
